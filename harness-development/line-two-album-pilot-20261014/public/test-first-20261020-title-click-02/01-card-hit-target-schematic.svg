<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">LINE album card hit-target schematic</title>
  <desc id="desc">Synthetic, privacy-safe diagram of a LINE album card. The cover thumbnail cells open a single-photo viewer; the album title opens the album grid detail. Coordinates come from a 654 by 1286 CUA frame captured on 2026-10-20.</desc>
  <rect x="0" y="0" width="1000" height="620" fill="#f5f5f7"/>
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f">LINE album card hit targets (synthetic schematic, not a screenshot)</text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#555">Actual CUA frame: 654 x 1286. The card below is not to scale; only the click semantics and recorded coordinates matter.</text>

  <!-- Card -->
  <rect x="40" y="100" width="620" height="430" rx="10" fill="#ffffff" stroke="#c9c9cf" stroke-width="2"/>

  <!-- Cover 2x2 -->
  <rect x="40" y="100" width="620" height="290" fill="#d9d9df"/>
  <rect x="40" y="100" width="310" height="145" fill="#cfd3d8" stroke="#ffffff" stroke-width="3"/>
  <rect x="350" y="100" width="310" height="145" fill="#c4c9cf" stroke="#ffffff" stroke-width="3"/>
  <rect x="40" y="245" width="310" height="145" fill="#c4c9cf" stroke="#ffffff" stroke-width="3"/>
  <rect x="350" y="245" width="310" height="145" fill="#b9bec5" stroke="#ffffff" stroke-width="3"/>
  <text x="195" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b3b40">cover thumbnail cell</text>
  <text x="505" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b3b40">cover thumbnail cell</text>
  <text x="195" y="311" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b3b40">cover thumbnail cell</text>
  <text x="505" y="311" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b3b40">cover thumbnail cell</text>

  <!-- Metadata strip -->
  <rect x="40" y="390" width="620" height="140" fill="#2f2f31"/>
  <text x="70" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#ffffff">2024/05/27～05/31</text>
  <text x="70" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a9a9ae">56</text>
  <circle cx="615" cy="438" r="3.5" fill="#c7c7cc"/>
  <circle cx="615" cy="450" r="3.5" fill="#c7c7cc"/>
  <circle cx="615" cy="462" r="3.5" fill="#c7c7cc"/>

  <!-- Wrong click marker -->
  <circle cx="320" cy="280" r="14" fill="#ff3b30" opacity="0.18"/>
  <circle cx="320" cy="280" r="6" fill="#ff3b30"/>
  <line x1="320" y1="280" x2="700" y2="225" stroke="#ff3b30" stroke-width="2.5"/>
  <rect x="700" y="188" width="270" height="76" rx="8" fill="#fff1f0" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="714" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#b42318">previous click [320,700]</text>
  <text x="714" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7a271a">cover thumbnail → single-photo viewer</text>
  <text x="714" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7a271a">observed title: (1/56)</text>

  <!-- Correct click marker -->
  <circle cx="120" cy="430" r="11" fill="none" stroke="#248a3d" stroke-width="2.5"/>
  <circle cx="120" cy="430" r="3" fill="#248a3d"/>
  <line x1="120" y1="430" x2="700" y2="390" stroke="#248a3d" stroke-width="2.5"/>
  <rect x="700" y="352" width="270" height="76" rx="8" fill="#effaf1" stroke="#248a3d" stroke-width="1.5"/>
  <text x="714" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">correct click [120,310]</text>
  <text x="714" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#14532d">album title text → album grid detail</text>
  <text x="714" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#14532d">observed title: 2024/05/27～05/31</text>

  <!-- Outcome comparison -->
  <rect x="40" y="548" width="300" height="48" rx="8" fill="#fff1f0" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="56" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318">WRONG: card-center heuristic</text>
  <text x="56" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7a271a">hit a thumbnail cell; no album-detail identity</text>

  <rect x="360" y="548" width="300" height="48" rx="8" fill="#effaf1" stroke="#248a3d" stroke-width="1.5"/>
  <text x="376" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">CORRECT: verified title OCR center</text>
  <text x="376" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#14532d">hit the metadata strip; grid detail opens</text>

  <text x="676" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#555">Same rule for album B:</text>
  <text x="676" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#555">click [120,1044] on its title.</text>
</svg>
