name: agent-resume

on:
  pull_request:
    paths:
      - "scripts/line_backup_agent_resume.py"
      - "scripts/line_backup_agent_resume_cua.mjs"
      - "scripts/agent_resume/*.swift"
      - "tests/test_agent_resume.py"
      - "tests/test_agent_resume_cua.mjs"
      - ".github/workflows/agent-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: python3 --version && uname -a
      - name: Run Python core tests
        run: python3 -B -m unittest discover -s tests -p 'test_agent_resume.py' -v

  node-wrapper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: node --version && python3 --version && uname -a
      - name: Check wrapper syntax
        run: node --check scripts/line_backup_agent_resume_cua.mjs
      - name: Run wrapper tests
        run: node --test tests/test_agent_resume_cua.mjs

  mac-imageio:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: xcrun swiftc --version && python3 --version && uname -a
      - name: Run pinned ImageIO tests
        run: python3 -B -m unittest tests.test_agent_resume.MacImageDecoderTests -v
