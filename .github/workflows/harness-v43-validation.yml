name: Harness V4.3 Validation

on:
  push:
    branches:
      - harness-v4.3-validation
    paths:
      - ".harness-validation/**"
      - ".github/workflows/harness-v43-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-v43-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: V4.3 deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rehydrate canonical V4.3 core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v43"
          base64 --decode .harness-validation/v43-core.tgz.b64 > "$RUNNER_TEMP/v43-core.tgz"
          tar -xzf "$RUNNER_TEMP/v43-core.tgz" -C "$RUNNER_TEMP/v43"
          test "$(cat "$RUNNER_TEMP/v43/VERSION")" = "4.3.0"

      - name: Validate convergence and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .harness-validation/validate_v43.py "$RUNNER_TEMP/v43"

      - name: Publish deterministic summary
        shell: bash
        run: |
          {
            echo "## Harness V4.3 deterministic validation"
            echo
            echo "- Version/core contract: PASS"
            echo "- V4.2 six-field status compatibility: PASS"
            echo "- Model-agnostic canonical contract: PASS"
            echo "- 3-attempt ceiling fixture: PASS"
            echo "- 2x no-information-gain fixture: PASS"
            echo "- A→B→A oscillation fixture: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  line-backup-fixture:
    name: Line_backup Rev28 regression fixture
    needs: static-contract
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build and run deterministic Rev28 suite
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcrun swift build --package-path rev28
          xcrun swift test --package-path rev28 --skip OcrEngineTests

      - name: Run adversarial matrix twice
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcrun swift test --package-path rev28 --filter AdversarialMatrixTests
          xcrun swift test --package-path rev28 --filter AdversarialMatrixTests

      - name: Replay frozen historical evidence twice
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/replay"
          python3 rev28/Tools/replay_rev28.py --root . --output "$RUNNER_TEMP/replay/run-1.json"
          python3 rev28/Tools/replay_rev28.py --root . --output "$RUNNER_TEMP/replay/run-2.json"
          cmp "$RUNNER_TEMP/replay/run-1.json" "$RUNNER_TEMP/replay/run-2.json"

      - name: Publish fixture summary
        shell: bash
        run: |
          {
            echo "## Line_backup regression fixture"
            echo
            echo "- Rev28 deterministic suite: PASS"
            echo "- Adversarial matrix x2: PASS"
            echo "- Historical replay byte-identical x2: PASS"
            echo "- No real LINE interaction was performed."
          } >> "$GITHUB_STEP_SUMMARY"

  live-agent-behavior:
    name: Muse + DeepSeek + GLM behavior
    needs:
      - static-contract
      - line-backup-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARNESS_META_MODEL_API_KEY: ${{ secrets.HARNESS_META_MODEL_API_KEY }}
      HARNESS_OLLAMA_API_KEY: ${{ secrets.HARNESS_OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fail closed if validation secrets are unavailable
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HARNESS_META_MODEL_API_KEY" ]] || { echo "HARNESS_META_MODEL_API_KEY is unavailable"; exit 2; }
          [[ -n "$HARNESS_OLLAMA_API_KEY" ]] || { echo "HARNESS_OLLAMA_API_KEY is unavailable"; exit 2; }

      - name: Install and verify current Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex
          codex --version

      - name: Rehydrate canonical V4.3 core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v43"
          base64 --decode .harness-validation/v43-core.tgz.b64 > "$RUNNER_TEMP/v43-core.tgz"
          tar -xzf "$RUNNER_TEMP/v43-core.tgz" -C "$RUNNER_TEMP/v43"
          python3 .harness-validation/validate_v43.py "$RUNNER_TEMP/v43"

      - name: Run bounded real-model behavior validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .harness-validation/live_validation.sh
          .harness-validation/live_validation.sh "$RUNNER_TEMP/v43" "$RUNNER_TEMP/v43-live" | tee "$RUNNER_TEMP/live-console.txt"

      - name: Publish live summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Harness V4.3 live agent behavior"
            echo
            if [[ -f "$RUNNER_TEMP/v43-live/validation-summary.json" ]]; then
              echo '~~~json'
              cat "$RUNNER_TEMP/v43-live/validation-summary.json"
              echo '~~~'
            else
              echo "Validation did not reach the final summary. Inspect the uploaded evidence."
            fi
            echo
            echo "Interactive TUI /goal lifecycle remains a separate Mac/runtime acceptance boundary; this job validates equivalent bounded Codex exec behavior and durable artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-v43-live-validation
          path: |
            ${{ runner.temp }}/live-console.txt
            ${{ runner.temp }}/v43-live
          if-no-files-found: warn
